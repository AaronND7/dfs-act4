<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Simple - Gestión de Productos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }

        .error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .debug {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-header">
            <h1>Gestión de Productos</h1>
            <p>Sistema de gestión de inventario</p>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" value="admin@productos.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" value="admin123" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">Iniciar Sesión</button>
        </form>

        <div class="debug" id="debugInfo">
            <strong>Información de Depuración:</strong><br>
            API URL: <span id="apiUrl">http://localhost:8888/api</span><br>
            Estado: <span id="status">Listo</span>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8888/api';
        
        document.getElementById('apiUrl').textContent = API_URL;
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const messageEl = document.getElementById('message');
            const statusEl = document.getElementById('status');
            
            // Deshabilitar botón
            loginBtn.disabled = true;
            loginBtn.textContent = 'Iniciando sesión...';
            statusEl.textContent = 'Enviando petición...';
            
            try {
                console.log('🔍 Enviando petición a:', `${API_URL}/auth/login`);
                console.log('📧 Datos:', { email, password });
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                
                console.log('📡 Response status:', response.status);
                console.log('📡 Response headers:', response.headers);
                
                const result = await response.json();
                console.log('📋 Response body:', result);
                
                if (result.success) {
                    console.log('✅ Login exitoso');
                    localStorage.setItem('token', result.token);
                    
                    messageEl.className = 'message success';
                    messageEl.textContent = '✅ Inicio de sesión exitoso. Redirigiendo...';
                    statusEl.textContent = 'Login exitoso';
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 2000);
                } else {
                    console.log('❌ Error en login:', result);
                    messageEl.className = 'message error';
                    messageEl.textContent = `❌ ${result.message || 'Error en el inicio de sesión'}`;
                    statusEl.textContent = 'Error en login';
                }
            } catch (error) {
                console.error('❌ Error de conexión:', error);
                messageEl.className = 'message error';
                messageEl.textContent = `❌ Error de conexión: ${error.message}`;
                statusEl.textContent = 'Error de conexión';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
